name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build and publish Python distribution to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/nookwire
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Build distributions
        run: uv build

      - name: Verify wheel installation and CLI scripts
        run: |
          uv tool install --find-links dist nookwire
          nookwire --version
          nookwire-ssh --version

      - name: Publish package distributions to PyPI
        run: uv publish --trusted-publishing always
