[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nookwire"
dynamic = ["version"]
description = "Temporary SSH, SFTP, and SCP access to ephemeral workspaces"
readme = "README.md"
license = "MIT"
authors = [
    {name = "lars-hagen", email = "larsh2690@hotmail.com"}
]
requires-python = ">=3.10"
keywords = ["ssh", "sftp", "scp", "tunnel", "ephemeral", "remote-access", "asyncssh"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet",
    "Topic :: System :: Networking",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "asyncssh==2.24.0",
    "cryptography>=39",
    "websockets",
]

[project.urls]
Homepage = "https://github.com/lars-hagen/nookwire"
Repository = "https://github.com/lars-hagen/nookwire"
Issues = "https://github.com/lars-hagen/nookwire/issues"
Security = "https://github.com/lars-hagen/nookwire/security"

[project.scripts]
nookwire = "nookwire_ssh.cli:main"
nookwire-ssh = "nookwire_ssh.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "nookwire_ssh.__version__"}
